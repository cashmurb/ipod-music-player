<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>app name</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="ipod">
      <div class="close-btn" id="close-btn">x</div>

      <div class="screen">
          <img id="album-art" src="" alt="Album Art" />
          <div class="progress-bar" id="progress-bar">
              <div class="progress-fill" id="progress-fill"></div>
          </div>
      </div>

      <div class="song-info">
          <div id="song-name">No song playing</div>
          <div id="artist"></div>
      </div>

      <div class="click-wheel">
          <div class="wheel-btn menu" id="menu-btn">menu</div>
          <div class="wheel-btn prev" id="prev-btn">
              <img src="./assets/prev.svg" alt="Prev">
          </div>
          <div class="wheel-btn next" id="next-btn">
              <img src="./assets/next.svg" alt="Next">
          </div>
          <div class="wheel-btn play-pause" id="play-pause-btn">
              <span id="play-icon">▶</span>
          </div>
          <div class="center-btn" id="center-btn"></div>
    </div>

    <audio id="audio"></audio>
    <input type="file" id="file-input" webkitdirectory directory multiple style="display: none;">

    <script src="script.js"></script>
</div>
